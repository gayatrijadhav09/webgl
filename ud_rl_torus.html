<!DOCTYPE html>

<html>
<head>

<meta charset="UTF-8">
<title>Two 3D Torus</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4a5bb5;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<canvas id="glcanvas"></canvas>

<script>

const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl");

if (!gl) {
    alert("WebGL is not supported!");
}

// CANVAS

function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

// VERTEX SHADER

const vertexShaderSource = `

attribute vec3 position;

uniform float angleX;
uniform float angleY;

uniform float moveX;

uniform float objectX;

void main()
{

    // X ROTATION

    float cx = cos(angleX);
    float sx = sin(angleX);

    float y1 =
        position.y * cx -
        position.z * sx;

    float z1 =
        position.y * sx +
        position.z * cx;

    // Y ROTATION

    float cy = cos(angleY);
    float sy = sin(angleY);

    float x2 =
        position.x * cy +
        z1 * sy;

    float z2 =
        -position.x * sy +
        z1 * cy;

    // SCALE

    float scale = 0.30;

    // FINAL POSITION

    gl_Position = vec4(
        x2 * scale + objectX + moveX,
        y1 * scale,
        z2 * scale,
        1.0
    );

}

`;

// FRAGMENT SHADER

const fragmentShaderSource = `

precision mediump float;

uniform vec3 objectColor;

void main()
{

    gl_FragColor = vec4(
        objectColor,
        1.0
    );

}

`;

// CREATE SHADER

function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);

    if (!gl.getShaderParameter(
        shader,
        gl.COMPILE_STATUS
    )) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        return null;
    }

    return shader;
}

const vertexShader =
    createShader(
        gl.VERTEX_SHADER,
        vertexShaderSource
    );

const fragmentShader =
    createShader(
        gl.FRAGMENT_SHADER,
        fragmentShaderSource
    );

// PROGRAM

const program = gl.createProgram();

gl.attachShader(
    program,
    vertexShader
);

gl.attachShader(
    program,
    fragmentShader
);

gl.linkProgram(program);

gl.useProgram(program);

// TORUS

const R = 0.6;
const r = 0.25;

const U = 60;
const V = 40;

const vertices = [];

// TORUS POINT

function torusPoint(u, v) {

    const x =
        (R + r * Math.cos(v)) *
        Math.cos(u);

    const y =
        r * Math.sin(v);

    const z =
        (R + r * Math.cos(v)) *
        Math.sin(u);

    return [x, y, z];
}

// CREATE TORUS

for (let i = 0; i < U; i++) {

    const u1 =
        i * 2.0 * Math.PI / U;

    const u2 =
        (i + 1) * 2.0 * Math.PI / U;

    for (let j = 0; j < V; j++) {

        const v1 =
            j * 2.0 * Math.PI / V;

        const v2 =
            (j + 1) * 2.0 * Math.PI / V;

        const p1 =
            torusPoint(u1, v1);

        const p2 =
            torusPoint(u2, v1);

        const p3 =
            torusPoint(u2, v2);

        const p4 =
            torusPoint(u1, v2);

        // Triangle 1

        vertices.push(...p1);
        vertices.push(...p2);
        vertices.push(...p4);

        // Triangle 2

        vertices.push(...p2);
        vertices.push(...p3);
        vertices.push(...p4);
    }
}

// BUFFER

const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);

const positionLocation =
    gl.getAttribLocation(
        program,
        "position"
    );

gl.vertexAttribPointer(
    positionLocation,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(
    positionLocation
);

// UNIFORMS

const angleXLocation =
    gl.getUniformLocation(
        program,
        "angleX"
    );

const angleYLocation =
    gl.getUniformLocation(
        program,
        "angleY"
    );

const moveXLocation =
    gl.getUniformLocation(
        program,
        "moveX"
    );

const objectXLocation =
    gl.getUniformLocation(
        program,
        "objectX"
    );

const colorLocation =
    gl.getUniformLocation(
        program,
        "objectColor"
    );

// VARIABLES

// 3D ROTATION

let angleX = 0.0;
let angleY = 0.0;

// ROTATION SPEED

const rotationSpeedX = 0.02;
const rotationSpeedY = 0.015;

// LEFT TORUS MOVEMENT

let moveX = 0.0;

let direction = 1;

const movementSpeed = 0.004;

// DEPTH TEST

gl.enable(gl.DEPTH_TEST);

// DRAW TORUS

function drawTorus(
    rotationX,
    rotationY,
    movement,
    position,
    red,
    green,
    blue
) {

    gl.uniform1f(
        angleXLocation,
        rotationX
    );

    gl.uniform1f(
        angleYLocation,
        rotationY
    );

    gl.uniform1f(
        moveXLocation,
        movement
    );

    gl.uniform1f(
        objectXLocation,
        position
    );

    gl.uniform3f(
        colorLocation,
        red,
        green,
        blue
    );

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 3
    );
}

// RENDER

function render()
{

    // 360° 3D ROTATION

    angleX += rotationSpeedX;
    angleY += rotationSpeedY;

    if (angleX >= 2.0 * Math.PI) {

        angleX -= 2.0 * Math.PI;

    }

    if (angleY >= 2.0 * Math.PI) {

        angleY -= 2.0 * Math.PI;

    }

    // LEFT-RIGHT MOVEMENT

    moveX +=
        direction * movementSpeed;

    if (moveX >= 0.35) {

        direction = -1;

    }

    if (moveX <= -0.35) {

        direction = 1;

    }

    // CLEAR

    gl.clearColor(
        0.3,
        0.4,
        0.8,
        1.0
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
    );

    // LEFT TORUS
    // GREEN
    // LEFT ↔ RIGHT
    // 3D 360° ROTATION

    drawTorus(
        angleX,
        angleY,
        moveX,
        -0.55,
        0.1,
        1.0,
        0.2
    );

    // RIGHT TORUS
    // RED
    // 3D 360° ROTATION

    drawTorus(
        angleX,
        angleY,
        0.0,
        0.55,
        1.0,
        0.1,
        0.1
    );

    requestAnimationFrame(render);

}

// START

render();

</script>

</body>
</html>
