<!DOCTYPE html>
<html>
<head>
<title>3D Cube</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    width:100vw;
    height:100vh;
    display:block;
}
</style>
</head>

<body>

<canvas id="glcanvas"></canvas>

<script>

const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const vertexShaderSource = `
attribute vec3 a_position;

uniform float u_xAngle;
uniform float u_yAngle;

void main()
{
    float cx = cos(u_xAngle);
    float sx = sin(u_xAngle);

    float cy = cos(u_yAngle);
    float sy = sin(u_yAngle);

    float y = a_position.y * cx - a_position.z * sx;
    float z = a_position.y * sx + a_position.z * cx;

    float x = a_position.x * cy - z * sy;
    z = a_position.x * sy + z * cy;

    gl_Position = vec4(x, y, z, 1.0);
}
`;

const fragmentShaderSource = `
precision mediump float;

void main()
{
    gl_FragColor = vec4(0.2, 0.7, 1.0, 1.0);
}
`;

function createShader(type, source)
{
    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return shader;
}

const vertexShader =
    createShader(gl.VERTEX_SHADER, vertexShaderSource);

const fragmentShader =
    createShader(gl.FRAGMENT_SHADER, fragmentShaderSource);

const program = gl.createProgram();

gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);

gl.linkProgram(program);

gl.useProgram(program);

const vertices = new Float32Array([

    -0.5, -0.5,  0.5,
     0.5, -0.5,  0.5,
     0.5,  0.5,  0.5,

    -0.5, -0.5,  0.5,
     0.5,  0.5,  0.5,
    -0.5,  0.5,  0.5,

    -0.5, -0.5, -0.5,
    -0.5,  0.5, -0.5,
     0.5,  0.5, -0.5,

    -0.5, -0.5, -0.5,
     0.5,  0.5, -0.5,
     0.5, -0.5, -0.5,

    -0.5,  0.5, -0.5,
    -0.5,  0.5,  0.5,
     0.5,  0.5,  0.5,

    -0.5,  0.5, -0.5,
     0.5,  0.5,  0.5,
     0.5,  0.5, -0.5,

    -0.5, -0.5, -0.5,
     0.5, -0.5, -0.5,
     0.5, -0.5,  0.5,

    -0.5, -0.5, -0.5,
     0.5, -0.5,  0.5,
    -0.5, -0.5,  0.5,

     0.5, -0.5, -0.5,
     0.5,  0.5, -0.5,
     0.5,  0.5,  0.5,

     0.5, -0.5, -0.5,
     0.5,  0.5,  0.5,
     0.5, -0.5,  0.5,

    -0.5, -0.5, -0.5,
    -0.5, -0.5,  0.5,
    -0.5,  0.5,  0.5,

    -0.5, -0.5, -0.5,
    -0.5,  0.5,  0.5,
    -0.5,  0.5, -0.5

]);

const buffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);

const positionLocation =
    gl.getAttribLocation(program, "a_position");

gl.enableVertexAttribArray(positionLocation);

gl.vertexAttribPointer(
    positionLocation,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

const xAngleLocation =
    gl.getUniformLocation(program, "u_xAngle");

const yAngleLocation =
    gl.getUniformLocation(program, "u_yAngle");

let xAngle = 0;
let yAngle = 0;

function draw()
{
    gl.clearColor(0, 0, 0, 1);

    gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
    );

    gl.uniform1f(xAngleLocation, xAngle);
    gl.uniform1f(yAngleLocation, yAngle);

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        36
    );

    xAngle += 0.01;
    yAngle += 0.01;

    requestAnimationFrame(draw);
}

gl.enable(gl.DEPTH_TEST);

draw();

</script>

</body>
</html>
