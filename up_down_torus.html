<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Small Center Torus - WebGL</title>

    <style>

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #4a5bb5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<canvas id="glcanvas"></canvas>

<script>



const canvas = document.getElementById("glcanvas");

const gl = canvas.getContext("webgl");

if (!gl) {
    alert("WebGL is not supported!");
}



function resizeCanvas() {

    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

// VERTEX SHADER

const vertexShaderSource = `

attribute vec3 position;
attribute vec3 color;

uniform float angleX;

varying vec3 vColor;

void main()
{

 // X AXIS ROTATION
    

    float c = cos(angleX);
    float s = sin(angleX);

    float x = position.x;

    float y =
        position.y * c -
        position.z * s;

    float z =
        position.y * s +
        position.z * c;


    float scale = 0.35;

    gl_Position = vec4(
        x * scale,
        y * scale,
        z * scale,
        1.0
    );


    // Send color to fragment shader

    vColor = color;

}

`;


const fragmentShaderSource = `

precision mediump float;

varying vec3 vColor;

void main()
{

    gl_FragColor = vec4(
        vColor,
        1.0
    );

}

`;


function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);

    if (!gl.getShaderParameter(
        shader,
        gl.COMPILE_STATUS
    )) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        gl.deleteShader(shader);

        return null;
    }

    return shader;
}


const vertexShader = createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
);


const fragmentShader = createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
);



const program = gl.createProgram();

gl.attachShader(
    program,
    vertexShader
);

gl.attachShader(
    program,
    fragmentShader
);

gl.linkProgram(program);


if (!gl.getProgramParameter(
    program,
    gl.LINK_STATUS
)) {

    console.error(
        gl.getProgramInfoLog(program)
    );
}




gl.useProgram(program);


const R = 0.6;      // Main radius
const r = 0.25;     // Tube radius

const U = 60;       // Horizontal segments
const V = 40;       // Vertical segments


const vertices = [];
const colors = [];



// TORUS POINT FUNCTION

function torusPoint(u, v) {

    const x =
        (R + r * Math.cos(v)) *
        Math.cos(u);

    const y =
        r * Math.sin(v);

    const z =
        (R + r * Math.cos(v)) *
        Math.sin(u);

    return [
        x,
        y,
        z
    ];
}


for (let i = 0; i < U; i++) {

    const u1 =
        i * 2.0 * Math.PI / U;

    const u2 =
        (i + 1) * 2.0 * Math.PI / U;


    for (let j = 0; j < V; j++) {

        const v1 =
            j * 2.0 * Math.PI / V;

        const v2 =
            (j + 1) * 2.0 * Math.PI / V;


        // Four corners of quad

        const p1 =
            torusPoint(u1, v1);

        const p2 =
            torusPoint(u2, v1);

        const p3 =
            torusPoint(u2, v2);

        const p4 =
            torusPoint(u1, v2);



        const red =
            0.3 + Math.random() * 0.7;

        const green =
            0.3 + Math.random() * 0.7;

        const blue =
            0.3 + Math.random() * 0.7;


        // FIRST TRIANGLE
      

        vertices.push(...p1);
        vertices.push(...p2);
        vertices.push(...p4);



        // SECOND TRIANGLE

        vertices.push(...p2);
        vertices.push(...p3);
        vertices.push(...p4);


        
        // COLOR FOR 6 VERTICES

        for (let k = 0; k < 6; k++) {

            colors.push(
                red,
                green,
                blue
            );

        }

    }

}



const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);



const positionLocation =
    gl.getAttribLocation(
        program,
        "position"
    );

gl.vertexAttribPointer(
    positionLocation,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(
    positionLocation
);


const colorBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    colorBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(colors),
    gl.STATIC_DRAW
);



const colorLocation =
    gl.getAttribLocation(
        program,
        "color"
    );

gl.vertexAttribPointer(
    colorLocation,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(
    colorLocation
);




const angleXLocation =
    gl.getUniformLocation(
        program,
        "angleX"
    );



let angleX = 0.0;


// Rotation speed

const rotationSpeed = 0.02;




gl.enable(
    gl.DEPTH_TEST
);


function render() {


    angleX += rotationSpeed;


    // Keep angle between 0 and 2π

    if (angleX >= 2.0 * Math.PI) {

        angleX -= 2.0 * Math.PI;

    }


   

    gl.clearColor(
        0.3,
        0.4,
        0.8,
        1.0
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
    );


   

    gl.uniform1f(
        angleXLocation,
        angleX
    );


    

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 3
    );




    requestAnimationFrame(render);

}




render();

</script>

</body>
</html>
