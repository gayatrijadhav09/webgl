<!DOCTYPE html>
<html>
<head>
<title>animation</title>
<style>
canvas{
    border:2px solid black;
}
</style>
</head>
<body>

<canvas id="c" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");



const vs = `
attribute vec2 aPosition;
uniform vec2 uTranslation;

void main()
{
    gl_Position = vec4(aPosition + uTranslation,0.0,1.0);
}
`;

const fs = `
precision mediump float;
uniform vec4 uColor;

void main()
{
    gl_FragColor = uColor;
}
`;

function createShader(type,source)
{
    const shader = gl.createShader(type);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    return shader;
}

const vertexShader =
createShader(gl.VERTEX_SHADER,vs);

const fragmentShader =
createShader(gl.FRAGMENT_SHADER,fs);

const program = gl.createProgram();

gl.attachShader(program,vertexShader);
gl.attachShader(program,fragmentShader);

gl.linkProgram(program);
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

const aPosition =
gl.getAttribLocation(program,"aPosition");

gl.enableVertexAttribArray(aPosition);

gl.vertexAttribPointer(
aPosition,
2,
gl.FLOAT,
false,
0,
0
);

const uTranslation =
gl.getUniformLocation(program,"uTranslation");

const uColor =
gl.getUniformLocation(program,"uColor");



function drawRectangle(x,y,w,h,color)
{
    const vertices = [

        -w/2,-h/2,
         w/2,-h/2,
        -w/2, h/2,

        -w/2, h/2,
         w/2,-h/2,
         w/2, h/2
    ];

    gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array(vertices),
        gl.STATIC_DRAW
    );

    gl.uniform2f(uTranslation,x,y);
    gl.uniform4fv(uColor,color);

    gl.drawArrays(gl.TRIANGLES,0,6);
}



const tower1 = -0.65;
const tower2 = 0.00;
const tower3 = 0.65;



let redX = tower1;
let redY = -0.60;

let greenX = tower1;
let greenY = -0.52;

let blueX = tower1;
let blueY = -0.44;

let stage = 0;



function animate()
{
    gl.clearColor(1,1,1,1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    /* MOVE 1 : BLUE -> TOWER 3 */

    if(stage===0)
    {
        blueY+=0.01;
        if(blueY>=0.25) stage=1;
    }
    else if(stage===1)
    {
        blueX+=0.01;
        if(blueX>=tower3) stage=2;
    }
    else if(stage===2)
    {
        blueY-=0.01;
        if(blueY<=-0.60)
        {
            blueY=-0.60;
            stage=3;
        }
    }

    /* MOVE 2 : GREEN -> TOWER 2 */

    else if(stage===3)
    {
        greenY+=0.01;
        if(greenY>=0.25) stage=4;
    }
    else if(stage===4)
    {
        greenX+=0.01;
        if(greenX>=tower2) stage=5;
    }
    else if(stage===5)
    {
        greenY-=0.01;
        if(greenY<=-0.60)
        {
            greenY=-0.60;
            stage=6;
        }
    }

    /* MOVE 3 : BLUE -> GREEN */

    else if(stage===6)
    {
        blueY+=0.01;
        if(blueY>=0.25) stage=7;
    }
    else if(stage===7)
    {
        blueX-=0.01;
        if(blueX<=tower2) stage=8;
    }
    else if(stage===8)
    {
        blueY-=0.01;
        if(blueY<=-0.52)
        {
            blueY=-0.52;
            stage=9;
        }
    }

    /* MOVE 4 : RED -> TOWER 3 */

    else if(stage===9)
    {
        redY+=0.01;
        if(redY>=0.25) stage=10;
    }
    else if(stage===10)
    {
        redX+=0.01;
        if(redX>=tower3) stage=11;
    }
    else if(stage===11)
    {
        redY-=0.01;
        if(redY<=-0.60)
        {
            redY=-0.60;
            stage=12;
        }
    }

    /* MOVE 5 : BLUE -> TOWER 1 */

    else if(stage===12)
    {
        blueY+=0.01;
        if(blueY>=0.25) stage=13;
    }
    else if(stage===13)
    {
        blueX-=0.01;
        if(blueX<=tower1) stage=14;
    }
    else if(stage===14)
    {
        blueY-=0.01;
        if(blueY<=-0.44)
        {
            blueY=-0.44;
            stage=15;
        }
    }

    /* RESET */

    else if(stage===15)
    {
        redX=tower1;
        redY=-0.60;

        greenX=tower1;
        greenY=-0.52;

        blueX=tower1;
        blueY=-0.44;

        stage=0;
    }

    

    drawRectangle(redX,redY,0.50,0.08,[1,0,0,1]);
    drawRectangle(greenX,greenY,0.35,0.08,[0,1,0,1]);
    drawRectangle(blueX,blueY,0.22,0.08,[0,0,1,1]);

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
