<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title> Lighting</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#4a5bb5;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

</style>

</head>

<body>

<canvas id="glcanvas"></canvas>

<script>

// Canvas

const canvas = document.getElementById("glcanvas");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WebGL

const gl = canvas.getContext("webgl");

gl.enable(gl.DEPTH_TEST);

// Vertex Shader

const vsSource = `

attribute vec3 position;
attribute vec3 color;
attribute vec3 normal;

varying vec3 vColor;

uniform float angle;



// Matrix Multiplication

mat3 rotationX(float a)
{
    float c = cos(a);
    float s = sin(a);

    return mat3(
        1.0, 0.0, 0.0,

        0.0, c, -s,

        0.0, s, c
    );
}


mat3 rotationY(float a)
{
    float c = cos(a);
    float s = sin(a);

    return mat3(
         c, 0.0, s,

         0.0, 1.0, 0.0,

        -s, 0.0, c
    );
}


void main()
{


    // X-axis Tilt


    float tilt = 0.6;

    mat3 Rx = rotationX(tilt);


    // Y-axis Rotation
  

    mat3 Ry = rotationY(angle);


    // Final Rotation Matrix


    mat3 rotation = Ry * Rx;


    
    // Position


    vec3 rotatedPosition =
        rotation * position;


    
    // Normal


    vec3 rotatedNormal =
        rotation * normal;



    // Light

    vec3 lightDirection =
        normalize(
            vec3(1.0, 1.0, 1.0)
        );


    // Diffuse Lighting

    float brightness =
        max(
            dot(
                normalize(rotatedNormal),
                lightDirection
            ),
            0.0
        );
vColor=color * brightness;
   
    // Final Color
    

    vColor =
        color * brightness;


    // Final Position

    gl_Position =
        vec4(
            rotatedPosition * 0.5,
            1.0
        );

}

`;


const fsSource = `

precision mediump float;

varying vec3 vColor;

void main()
{

    gl_FragColor =
        vec4(
            vColor,
            1.0
        );

}

`;


function createShader(type, source)
{

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);

    return shader;

}


// Create Shaders

const vs =
    createShader(
        gl.VERTEX_SHADER,
        vsSource
    );

const fs =
    createShader(
        gl.FRAGMENT_SHADER,
        fsSource
    );

const program =
    gl.createProgram();

gl.attachShader(program, vs);

gl.attachShader(program, fs);

gl.linkProgram(program);

gl.useProgram(program);


// Arrays

const vertices = [];

const colors = [];

const normals = [];

// Torus Size


const R = 0.6;

const r = 0.25;


// Torus

function torus(u, v)
{

    let x =
        (R + r * Math.cos(v))
        * Math.cos(u);

    let z =
        (R + r * Math.cos(v))
        * Math.sin(u);

    let y =
        r * Math.sin(v);

    return [
        x,
        y,
        z
    ];

}

// Torus Normal

function torusNormal(u, v)
{

    let x =
        Math.cos(v)
        * Math.cos(u);

    let y =
        Math.sin(v);

    let z =
        Math.cos(v)
        * Math.sin(u);

    return [
        x,
        y,
        z
    ];

}



// Sections

const U = 50;

const V = 30;

// Generate Torus

for(let i = 0; i < U; i++)
{

    let u1 =
        i * 2 * Math.PI / U;

    let u2 =
        (i + 1) * 2 * Math.PI / U;


    for(let j = 0; j < V; j++)
    {

        let v1 =
            j * 2 * Math.PI / V;

        let v2 =
            (j + 1) * 2 * Math.PI / V;


        // Four points

        let p1 = torus(u1, v1);

        let p2 = torus(u2, v1);

        let p3 = torus(u2, v2);

        let p4 = torus(u1, v2);

       // Four normals

        let n1 =
            torusNormal(u1, v1);

        let n2 =
            torusNormal(u2, v1);

        let n3 =
            torusNormal(u2, v2);

        let n4 =
            torusNormal(u1, v2);

        // Color

        let colorIndex = i % 2;

        let rr;
        let gg;
        let bb;


        if(colorIndex == 0)
        {
            rr = 1.0;
            gg = 1.0;
            bb = 1.0;
        }
        else
        {
            rr = 1.0;
            gg = 0.0;
            bb = 1.0;
        }



        // Triangle 1


        vertices.push(...p1);
        vertices.push(...p2);
        vertices.push(...p4);

        normals.push(...n1);
        normals.push(...n2);
        normals.push(...n4);

        colors.push(
            rr, gg, bb,
            rr, gg, bb,
            rr, gg, bb
        );



        // Triangle2

        vertices.push(...p2);
        vertices.push(...p3);
        vertices.push(...p4);

        normals.push(...n2);
        normals.push(...n3);
        normals.push(...n4);

        colors.push(
            rr, gg, bb,
            rr, gg, bb,
            rr, gg, bb
        );

    }

}



// Position Buffer

const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);


const posLoc =
    gl.getAttribLocation(
        program,
        "position"
    );

gl.vertexAttribPointer(
    posLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(posLoc);

// Color Buffer

const colorBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    colorBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(colors),
    gl.STATIC_DRAW
);


const colorLoc =
    gl.getAttribLocation(
        program,
        "color"
    );

gl.vertexAttribPointer(
    colorLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(colorLoc);

// Normal Buffer

const normalBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    normalBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(normals),
    gl.STATIC_DRAW
);


const normalLoc =
    gl.getAttribLocation(
        program,
        "normal"
    );

gl.vertexAttribPointer(
    normalLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(normalLoc);



// Angle


let angle = 0;

const angleLoc =
    gl.getUniformLocation(
        program,
        "angle"
    );



function render()
{

    angle += 0.01;


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    gl.clearColor(
        0.3,
        0.4,
        0.8,
        1.0
    );


    gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
    );


    gl.uniform1f(
        angleLoc,
        angle
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 3
    );


    requestAnimationFrame(render);

}

render();

</script>

</body>

</html>
