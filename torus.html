<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#4a5bb5;
}
canvas{
    display:block;
    width:100vw;
    height:100vh;
}
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<script>

const canvas = document.getElementById("glcanvas");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gl = canvas.getContext("webgl");

const vsSource = `
attribute vec3 position;
uniform float angle;

void main()
{
    float c = cos(angle);
    float s = sin(angle);

    vec3 p = position;

    // Tilt around X-axis
    float tilt = 0.6;

    float y = p.y * cos(tilt) - p.z * sin(tilt);
    float z = p.y * sin(tilt) + p.z * cos(tilt);

    // Rotate around Y-axis
    float x = p.x * c - z * s;
    z = p.x * s + z * c;

    gl_Position = vec4(
        x * 0.5,
        y * 0.5,
        z * 0.5,
        1.0
    );
}
`;

const fsSource = `
precision mediump float;

void main()
{
    gl_FragColor = vec4(
        0.85,
        0.85,
        0.85,
        1.0
    );
}
`;

function createShader(type, source)
{
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return shader;
}

const vs = createShader(gl.VERTEX_SHADER, vsSource);
const fs = createShader(gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

const vertices = [];

const R = 0.6;
const r = 0.25;

function torus(u,v)
{
    const x = (R + r*Math.cos(v))*Math.cos(u);
    const z = (R + r*Math.cos(v))*Math.sin(u);
    const y = r*Math.sin(v);

    return [x,y,z];
}

const U = 50;
const V = 30;

for(let i=0;i<U;i++)
{
    let u1 = i*2*Math.PI/U;
    let u2 = (i+1)*2*Math.PI/U;

    for(let j=0;j<V;j++)
    {
        let v1 = j*2*Math.PI/V;
        let v2 = (j+1)*2*Math.PI/V;

        let p1 = torus(u1,v1);
        let p2 = torus(u2,v1);

        vertices.push(...p1);
      vertices.push(...p2);

        let p3 = torus(u1,v1);
        let p4 = torus(u1,v2);
        vertices.push(...p3);
          vertices.push(...p4);
    }
}

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);

const posLoc = gl.getAttribLocation(program,"position");

gl.vertexAttribPointer(
    posLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(posLoc);

const angleLoc = gl.getUniformLocation(program,"angle");

let angle = 0;

function render()
{
    angle += 0.01;

    gl.viewport(0,0,canvas.width,canvas.height);

    gl.clearColor(0.3,0.4,0.8,1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1f(angleLoc, angle);

    gl.drawArrays(
        gl.LINES,
        0,
        vertices.length/3
    );

    requestAnimationFrame(render);
}

render();

</script>

</body>
</html>
