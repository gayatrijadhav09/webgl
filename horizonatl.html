<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Horizontal</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#4a5bb5;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

</style>

</head>

<body>

<canvas id="glcanvas"></canvas>

<script>



// Canvas


const canvas = document.getElementById("glcanvas");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;



// WebGL


const gl = canvas.getContext("webgl");

gl.enable(gl.DEPTH_TEST);


// Vertex Shader


const vsSource = `

attribute vec3 position;
attribute vec3 color;

varying vec3 vColor;

uniform float angle;

void main()
{

    // Send color to fragment shader
    vColor = color;


    // Rotation
    float c = cos(angle);
    float s = sin(angle);

    vec3 p = position;


    // Tilt
    float tilt = 0.6;

    float y =
        p.y * cos(tilt)
        - p.z * sin(tilt);

    float z =
        p.y * sin(tilt)
        + p.z * cos(tilt);


    // Rotation around Y axis
    float x =
        p.x * c
        - z * s;

    z =
        p.x * s
        + z * c;


    // Final position
    gl_Position = vec4(
        x * 0.5,
        y * 0.5,
        z * 0.5,
        1.0
    );

}

`;



// Fragment Shader


const fsSource = `

precision mediump float;

varying vec3 vColor;

void main()
{

    gl_FragColor = vec4(
        vColor,
        1.0
    );

}

`;



// Create Shader


function createShader(type, source)
{

    const shader = gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);

    return shader;

}



// Create Vertex Shader


const vs = createShader(
    gl.VERTEX_SHADER,
    vsSource
);


        // Create Fragment Shader


const fs = createShader(
    gl.FRAGMENT_SHADER,
    fsSource
);



// Create Program


const program = gl.createProgram();

gl.attachShader(
    program,
    vs
);

gl.attachShader(
    program,
    fs
);

gl.linkProgram(program);

gl.useProgram(program);



    // Arrays

const vertices = [];

const colors = [];



                      // Torus Size

const R = 0.6;

const r = 0.25;



// Torus Function


function torus(u, v)
{

    let x =
        (R + r * Math.cos(v))
        * Math.cos(u);

    let z =
        (R + r * Math.cos(v))
        * Math.sin(u);

    let y =
        r * Math.sin(v);

    return [
        x,
        y,
        z
    ];

}



// Number of Sections


const U = 50;

const V = 30;



// Generate Torus


for(let i = 0; i < U; i++)
{

    let u1 =
        i * 2 * Math.PI / U;

    let u2 =
        (i + 1) * 2 * Math.PI / U;


    for(let j = 0; j < V; j++)
    {

        let v1 =
            j * 2 * Math.PI / V;

        let v2 =
            (j + 1) * 2 * Math.PI / V;


       
        // Four points of one section
        

        let p1 =
            torus(u1, v1);

        let p2 =
            torus(u2, v1);

        let p3 =
            torus(u2, v2);

        let p4 =
            torus(u1, v2);


     
                            // Horizontal Black / White Color
     

        let colorIndex = j % 2;

        let rr;
        let gg;
        let bb;


        // Black
        if(colorIndex == 0)
        {

            rr = 0.0;
            gg = 0.0;
            bb = 0.0;

        }


        // White
        else
        {

            rr = 1.0;
            gg = 1.0;
            bb = 1.0;

        }


        
        // Triangle 1
       

        vertices.push(...p1);

        vertices.push(...p2);

        vertices.push(...p4);


       
        // Triangle 2
        

        vertices.push(...p2);

        vertices.push(...p3);

        vertices.push(...p4);


        
        // Same color for 6 vertices
        

        for(let k = 0; k < 6; k++)
        {

            colors.push(
                rr,
                gg,
                bb
            );

        }

    }

}



// Position Buffer


const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);



// Position Attribute


const posLoc =
    gl.getAttribLocation(
        program,
        "position"
    );

gl.vertexAttribPointer(
    posLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(
    posLoc
);



// Color Buffer


const colorBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    colorBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(colors),
    gl.STATIC_DRAW
);



// Color Attribute


const colorLoc =
    gl.getAttribLocation(
        program,
        "color"
    );

gl.vertexAttribPointer(
    colorLoc,
    3,
    gl.FLOAT,
    false,
    0,
    0
);

gl.enableVertexAttribArray(
    colorLoc
);



// Angle

let angle = 0;
const angleLoc =
    gl.getUniformLocation(
        program,
        "angle"
    );


// Animation


function render()
{
    angle += 0.01;


                                          // Viewport
    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


                                          // Depth
    gl.clearDepth(1.0);


                                         // Background
    gl.clearColor(
        0.3,
        0.4,
        0.8,
        1.0
    );


                                         // Clear screen
    gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
    );


                                       // Send angle 
    gl.uniform1f(
        angleLoc,
        angle
    );


                                          // Draw Torus
    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 3
    );


                                         // Next frame
    requestAnimationFrame(
        render
    );

}



// Start Animation


render();

</script>

</body>

</html>
