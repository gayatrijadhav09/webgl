<!DOCTYPE html>
<html>
<head>
<title>Rectangle Animation</title>
<style>
body{
    text-align:center;
}
canvas{
    border:1px solid black;
}
</style>
</head>
<body>

<canvas id="glcanvas" width="600" height="500"></canvas>

<script>

const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl");

const vs = `
attribute vec2 coordinates;
void main()
{
    gl_Position = vec4(coordinates,0.0,1.0);
}
`;

const fs = `
precision mediump float;
uniform vec4 uColor;
void main()
{
    gl_FragColor = uColor;
}
`;

function createShader(type,source)
{
    const shader = gl.createShader(type);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    return shader;
}

const vertexShader =
createShader(gl.VERTEX_SHADER,vs);

const fragmentShader =
createShader(gl.FRAGMENT_SHADER,fs);

const program = gl.createProgram();

gl.attachShader(program,vertexShader);
gl.attachShader(program,fragmentShader);

gl.linkProgram(program);
gl.useProgram(program);

const colorLoc =
gl.getUniformLocation(program,"uColor");

const coord =
gl.getAttribLocation(program,"coordinates");

let rects = [

{
x:-0.8,
y:-0.5,
w:0.50,
h:0.20,
color:[1,0,0]
},

{
x:0.25,
y:-0.5,
w:0.35,
h:0.20,
color:[0,1,0]
},

{
x:0.70,
y:-0.5,
w:0.20,
h:0.20,
color:[0,0,1]
}

];

let targets = [

{x:-0.3,y:-0.5},

{x:-0.22,y:-0.3},

{x:-0.15,y:-0.1}

];

let current = 2;

function drawRectangle(x,y,w,h,color)
{
let vertices = [

x,y,
x+w,y,
x+w,y+h,
x,y+h

];

const buffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

gl.bufferData(
gl.ARRAY_BUFFER,
new Float32Array(vertices),
gl.STATIC_DRAW
);

gl.vertexAttribPointer(
coord,
2,
gl.FLOAT,
false,
0,
0
);

gl.enableVertexAttribArray(coord);

gl.uniform4f(
colorLoc,
color[0],
color[1],
color[2],
1.0
);

gl.drawArrays(
gl.TRIANGLE_FAN,
0,
4
);
}

function drawScene()
{
gl.clearColor(1,1,1,1);
gl.clear(gl.COLOR_BUFFER_BIT);

for(let r of rects)
{
drawRectangle(
r.x,
r.y,
r.w,
r.h,
r.color
);
}
}

function animate()
{
if(current >= 0)
{
let r = rects[current];
let t = targets[current];

r.x += (t.x-r.x)*0.05;
r.y += (t.y-r.y)*0.05;

if(
Math.abs(r.x-t.x)<0.01 &&
Math.abs(r.y-t.y)<0.01
)
{
r.x=t.x;
r.y=t.y;
current--;
}
}

drawScene();

requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
